; ==============================================================================
; File Konfigurasi Supervisor untuk Laravel Queue Worker
; Proyek: KampusLMS (Kelompok A07)
; Penanggung Jawab: Nabil Hafidz Mubarok (Infrastruktur, Database & Supervisor)
; Lokasi Deployment Server: /etc/supervisor/conf.d/kampuslms-worker.conf
; ==============================================================================

[program:kampuslms-worker]
; Format penamaan sub-proses saat numprocs > 1 (contoh: kampuslms-worker_00, kampuslms-worker_01)
process_name=%(program_name)s_%(process_num)02d

; Perintah eksekusi queue worker Laravel 12:
; - database: Menggunakan driver database (tabel `jobs`)
; - --sleep=3: Istirahat 3 detik jika tidak ada job baru di antrean untuk menghemat CPU
; - --tries=3: Batas maksimal percobaan job sebelum dianggap gagal dan dipindahkan ke `failed_jobs`
; - --max-time=3600: Worker otomatis restart setelah berjalan 1 jam untuk mencegah memory leak
; - --timeout=90: Batas waktu maksimal eksekusi 1 job sebelum proses dihentikan (harus <= retry_after di config/queue.php)
command=php /var/www/kampuslms/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90

; Menjalankan worker secara otomatis saat daemon Supervisor / OS booting
autostart=true

; Otomatis me-restart worker jika proses mati mendadak, mengalami error, atau keluar karena `queue:restart`
autorestart=true

; Mengirim sinyal stop (SIGTERM) dan kill (SIGKILL) ke seluruh grup proses anak (mencegah zombie/orphan process)
stopasgroup=true
killasgroup=true

; Menjalankan worker di bawah pengguna non-root (www-data) demi mematuhi prinsip Least Privilege
user=www-data

; Jumlah worker proses paralel yang dijalankan bersamaan untuk konkurensi pemrosesan antrean
numprocs=2

; Menggabungkan keluaran standar error (stderr) ke log standar output (stdout)
redirect_stderr=true

; Jalur penyimpanan log eksekusi dan rotasi berkas log
stdout_logfile=/var/log/supervisor/kampuslms-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Toleransi waktu tunggu (detik) agar worker menyelesaikan job aktif sebelum dipaksa berhenti (graceful shutdown)
stopwaitsecs=3600

